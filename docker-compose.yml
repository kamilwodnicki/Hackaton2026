services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-directus.sql:/docker-entrypoint-initdb.d/init-directus.sql

  directus:
    image: directus/directus:latest
    container_name: directus_app
    restart: always
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      db:
        condition: service_started
    environment:
      - DB_CLIENT=pg
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=mydb
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - KEY=b943d8c8-7013-40a1-8d23-2895ea3f40f1
      - SECRET=4a413d90-b18e-4f7b-9442-990eef5f87be
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    profiles: ["ai"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  web:
    build: 
      context: .
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: python_app
    restart: always
    command: python app/main.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mydb
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COMPUTE_DEVICE=cuda
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-SpeakLeash/bielik-minitron-7B-v3.0-instruct:Q4_K_M}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama_pull
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-SpeakLeash/bielik-minitron-7B-v3.0-instruct:Q4_K_M}"]
    restart: "no"

  ioss-scraper:
    build: .
    profiles: ["tools"]
    command: python scrapers/ioss/main.py --interval-hours 48
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mydb
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
    depends_on:
      db:
        condition: service_started

  biblioteka-scraper:
    build: .
    profiles: ["tools"]
    command: python scrapers/biblioteka/main.py --interval-hours 48
    restart: unless-stopped
    volumes:
      - ./data:/app/data          # JSON i PDF-y muszą trafić na hosta, żeby widział je ingest
    environment:
      - PYTHONUNBUFFERED=1        # bez tego print() nie pojawia się w docker logs

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  directus_uploads:
  directus_extensions:
