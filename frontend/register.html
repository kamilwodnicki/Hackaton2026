<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejestracja SSO | Dostępność</title>
    <link rel="icon" href="assets/logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-auth-page="register">
    <header class="site-header auth-header"><a class="brand" href="/" aria-label="Strona główna"><img class="brand-logo" src="assets/logo.ico" alt="Logo organizacji" /></a><a class="auth-home-link" href="/">Strona główna</a></header>
    <main class="auth-page" id="main-content">
      <section class="auth-card" aria-labelledby="register-title">
        <p class="account-eyebrow">Utwórz konto</p><h1 id="register-title">Rejestracja</h1>
        <p>Masz już konto? <a href="login.html">Zaloguj się</a>.</p>
        <form class="auth-form" id="auth-form">
          <label for="register-name">Imię i nazwisko lub nazwa NGO</label><input id="register-name" name="name" autocomplete="name" required />
          <label for="register-email">Służbowy lub prywatny adres e-mail</label><input id="register-email" name="email" type="email" autocomplete="email" required />
          <label for="register-password">Hasło</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          <fieldset class="registration-roles"><legend>Rola użytkownika <span>(wybierz jedną)</span></legend><label><input name="roles" type="radio" value="resident" checked /> Mieszkaniec / NGO</label><label><input name="roles" type="radio" value="jst" /> Pracownik JST</label><label><input name="roles" type="radio" value="rops" /> Pracownik ROPS</label><label><input name="roles" type="radio" value="expert" /> Ekspert branżowy / mentor</label></fieldset>
          <p class="role-help" id="role-help"></p>
          <button class="email-auth-button" type="submit">Zarejestruj się e-mailem</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
          <div class="auth-divider"><span>lub użyj SSO</span></div>
          <div class="sso-actions"><button type="button" data-sso-provider="microsoft">Zarejestruj z Microsoft</button><button type="button" data-sso-provider="google">Zarejestruj z Google</button><button type="button" data-sso-provider="login-gov">Zarejestruj z login.gov.pl</button></div>
        </form>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
