<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie SSO | Dostępność</title>
    <link rel="icon" href="assets/logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-auth-page="login">
    <header class="site-header auth-header"><a class="brand" href="/" aria-label="Strona główna"><img class="brand-logo" src="assets/logo.ico" alt="Logo organizacji" /></a><a class="auth-home-link" href="/">Strona główna</a></header>
    <main class="auth-page" id="main-content">
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="account-eyebrow">Bezpieczny dostęp</p><h1 id="auth-title">Zaloguj się</h1>
        <p>Nie masz jeszcze konta? <a href="register.html">Zarejestruj się</a>.</p>
        <form class="auth-form" id="auth-form">
          <label for="login-email">Adres e-mail</label><input id="login-email" name="email" type="email" autocomplete="email" required />
          <label for="login-password">Hasło</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required />
          <button class="email-auth-button" type="submit">Zaloguj się e-mailem</button>
        </form>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        <div class="auth-divider"><span>lub użyj SSO</span></div>
        <div class="sso-actions"><button type="button" data-sso-provider="microsoft">Kontynuuj z Microsoft</button><button type="button" data-sso-provider="google">Kontynuuj z Google</button><button type="button" data-sso-provider="login-gov">Kontynuuj z login.gov.pl</button></div>
        <p class="auth-note">Tryb demonstracyjny — formularz i dostawcy SSO tworzą lokalną sesję bez wysyłania danych.</p>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
